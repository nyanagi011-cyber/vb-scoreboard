<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>渡慶次GOLDENSスコアボード</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        @font-face {
            font-family: 'DSEG7Classic';
            src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff') format('woff');
            font-weight: bold; font-style: italic;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            box-sizing: border-box; font-family: 'Inter', sans-serif;
        }

        button, a, input, select, textarea { touch-action: manipulation; }
        body { background-color: #ffffff; color: #111827; overflow: hidden; height: 100dvh; width: 100vw; }
        ::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; display: block; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

        .set-table { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
        .set-table th, .set-table td { border: 1px solid #e5e7eb; text-align: center; vertical-align: middle; padding: 2px; }
        .set-table th { background-color: #f3f4f6; font-size: 0.7rem; color: #4b5563; height: 20px; }
        .current-set-row td { background-color: #fef08a; }

        @keyframes pulse-fast { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        .score-pulse { animation: pulse-fast 1s infinite ease-in-out; }

        .score-digital { font-family: 'DSEG7Classic', monospace; line-height: 1; text-align: center; letter-spacing: 0.05em; font-size: clamp(3rem, 18vw, 30vh); text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .team-header-box { position: relative; display: flex; align-items: center; justify-content: center; padding: 5px; height: 4rem; background-color: rgba(0,0,0,0.15); }
    </style>
</head>
<body class="flex flex-col items-center bg-gray-50">

    <!-- ================= 1. 初期スタート画面 ================= -->
    <div id="startup-overlay" class="fixed inset-0 bg-gray-900 z-[300] flex flex-col items-center justify-center p-4">
        
        <!-- メインメニュー -->
        <div id="startup-menu" class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl flex flex-col items-center gap-5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-yellow-500"></div>
            <img src="goldenz.png" onerror="this.src='https://placehold.co/100x100/f5a623/ffffff?text=LOGO'" class="w-24 h-24 object-contain drop-shadow-md">
            <h1 class="text-2xl font-black text-gray-900 text-center leading-tight">渡慶次GOLDENS<br>スコアボード</h1>
            
            <div class="w-full flex flex-col gap-3 pt-2">
                <button onclick="window.startNewMatch()" class="py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black text-sm shadow-md active:scale-95 flex flex-col items-center justify-center gap-0.5">
                    <div class="flex items-center gap-2"><i data-lucide="play-circle" class="w-5 h-5"></i> <span>試合を始める</span></div>
                    <span class="text-[10px] font-normal opacity-90">(新規設定)</span>
                </button>
                <button onclick="window.manageMatches()" class="py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm shadow-md active:scale-95 flex flex-col items-center justify-center gap-0.5">
                    <div class="flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5"></i> <span>試合中の点数を管理する</span></div>
                    <span class="text-[10px] font-normal opacity-90">(既存編集)</span>
                </button>
                <button onclick="window.showViewerMatchList()" class="py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black text-sm shadow-md active:scale-95 flex flex-col items-center justify-center gap-0.5">
                    <div class="flex items-center gap-2"><i data-lucide="eye" class="w-5 h-5"></i> <span>閲覧者として入る</span></div>
                    <span class="text-[10px] font-normal opacity-90">(観戦専用)</span>
                </button>
                <button onclick="window.showAllMatchList()" class="py-3 mt-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl font-black text-sm shadow-md active:scale-95 flex flex-col items-center justify-center gap-0.5">
                    <div class="flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i> <span>試合一覧</span></div>
                    <span class="text-[10px] font-normal opacity-90">(過去の試合結果確認)</span>
                </button>
            </div>
        </div>

        <!-- 閲覧者用：今日の試合一覧 -->
        <div id="startup-match-list-container" class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl hidden flex-col relative max-h-[85vh]">
            <div class="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-gray-900 flex items-center gap-2"><i data-lucide="radio" class="w-5 h-5 text-emerald-500 animate-pulse"></i> 今日の試合</h2>
                <button onclick="window.backToStartupMenu()" class="text-xs font-bold text-gray-600 bg-gray-100 px-3 py-2 rounded-lg active:scale-95">最初の画面へ</button>
            </div>
            <div id="match-list-body" class="flex-1 overflow-y-auto space-y-2 pb-4 custom-scrollbar"></div>
        </div>

        <!-- 全試合一覧 (今日・過去) -->
        <div id="startup-all-list-container" class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl hidden flex-col relative max-h-[85vh]">
            <div class="absolute top-0 left-0 w-full h-2 bg-gray-800"></div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-gray-900 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-gray-700"></i> 試合一覧</h2>
                <button onclick="window.backToStartupMenuFromAll()" class="text-xs font-bold text-gray-600 bg-gray-100 px-3 py-2 rounded-lg active:scale-95">最初の画面へ</button>
            </div>
            <div id="all-match-list-body" class="flex-1 overflow-y-auto space-y-4 pb-4 custom-scrollbar"></div>
        </div>
    </div>

    <!-- ================= 2. メインスコアボード画面 ================= -->
    <header class="w-full max-w-[1200px] flex justify-between items-center px-2 py-1.5 border-b border-gray-200 bg-white z-50 shrink-0 relative shadow-sm">
        <div class="flex items-center gap-2 w-1/4 sm:w-1/3">
            <div class="flex items-center gap-1.5 font-mono font-black text-[10px] sm:text-xs bg-gray-100 px-2.5 py-1.5 rounded-md border border-gray-300">
                <div id="connection-status" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></div>
                <span id="room-name-display" class="truncate text-emerald-600">LIVE</span>
            </div>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center px-1 overflow-hidden">
            <div id="header-match-name" class="text-xs sm:text-sm font-black text-gray-900 truncate w-full text-center">練習試合</div>
            <div class="text-[10px] text-gray-500 font-bold truncate w-full text-center mt-0.5">
                <span id="header-location">体育館</span> | <span id="header-format" class="text-gray-800">3S(21pt)</span>
            </div>
        </div>
        <div class="flex items-center gap-2 w-1/4 sm:w-1/3 justify-end">
            <button id="btn-open-settings" onclick="window.openSettings()" class="admin-only bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 p-2 rounded-md active:scale-95">
                <i data-lucide="settings" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <button id="btn-back-to-viewer-list" onclick="window.backToViewerList()" class="viewer-only hidden bg-emerald-100 hover:bg-emerald-200 border border-emerald-300 text-emerald-800 px-3 py-1.5 rounded-md active:scale-95 text-[10px] sm:text-xs font-bold flex items-center gap-1 shadow-sm">
                <i data-lucide="list" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">今日の試合一覧に戻る</span><span class="sm:hidden">一覧へ</span>
            </button>
        </div>
    </header>

    <main id="main-ui" class="w-full max-w-[1200px] flex-1 flex p-1.5 sm:p-2 gap-1.5 sm:gap-2 overflow-hidden bg-gray-100 min-h-0">
        <!-- チームA -->
        <div class="flex-1 flex flex-col min-w-0 h-full rounded-2xl overflow-hidden shadow-lg border border-gray-200 relative" style="background-color: var(--color-a);">
            <div class="team-header-box shrink-0">
                <div id="badge-a" class="absolute top-1 left-1/2 -translate-x-1/2 font-black px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs shadow-md hidden z-20 bg-red-600 border border-red-400 text-white animate-bounce">マッチP</div>
                <div class="w-10 h-10 flex items-center justify-center mr-2 shrink-0">
                    <img id="ui-logo-a" src="goldenz.png" onerror="this.src='https://placehold.co/100x100/f5a623/ffffff?text=A'" class="w-full h-full object-contain drop-shadow-md">
                </div>
                <div class="flex flex-col justify-center h-full min-w-0">
                    <div id="ui-name-a" class="text-base sm:text-lg font-black text-black whitespace-pre-wrap leading-tight text-left break-words truncate">渡慶次<br>GOLDENS</div>
                </div>
            </div>

            <button id="score-btn-a" class="viewer-disable-click flex-1 w-full flex flex-col relative transition-all overflow-hidden min-h-0 cursor-pointer p-4 items-center justify-center" onclick="window.updateScore('A', 1)">
                <div id="serve-indicator-a" class="absolute top-3 right-3 flex items-center gap-1 px-3 py-1 bg-white text-black rounded-full font-black text-xs shadow-md z-20">
                    <i data-lucide="volleyball" class="w-3 h-3 fill-black"></i> サーブ
                </div>
                <div id="ui-score-a" class="score-digital text-white font-black w-full">0</div>
            </button>

            <div class="admin-only h-12 flex justify-between items-center px-3 bg-black/20 shrink-0 z-30">
                <button class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center text-white font-black text-xs shadow-md active:scale-95" onclick="window.openSubModal(); event.stopPropagation();">
                    <i data-lucide="arrow-left-right" class="w-3.5 h-3.5 mr-1.5"></i> 交代
                </button>
                <button class="w-9 h-9 bg-white/30 hover:bg-white/40 rounded-full flex items-center justify-center text-black active:scale-90" onclick="window.updateScore('A', -1); event.stopPropagation();">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- 中央: セットスコア表 -->
        <div class="w-40 sm:w-56 flex flex-col gap-1.5 shrink-0 h-full min-h-0">
            <div class="bg-white border border-gray-200 rounded-xl p-2 shadow-sm text-center flex flex-col justify-center shrink-0">
                <div class="text-gray-800 font-bold text-sm sm:text-base flex items-center justify-center gap-1">
                    第 <span id="ui-current-set" class="text-blue-600 text-3xl font-black leading-none">1</span> S
                </div>
                <div id="ui-deuce-banner" class="hidden mt-1 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse shadow w-max mx-auto">DEUCE</div>
            </div>
            <div class="flex-1 bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm min-h-0">
                <table class="set-table w-full h-full">
                    <thead>
                        <tr>
                            <th class="w-[20%] text-[9px]">S</th>
                            <th class="w-[40%] font-black text-[10px] sm:text-xs truncate px-1" id="table-th-a" style="color: var(--color-a);">渡慶次</th>
                            <th class="w-[40%] font-black text-[10px] sm:text-xs truncate px-1" id="table-th-b" style="color: var(--color-b);">チームB</th>
                        </tr>
                    </thead>
                    <tbody id="sets-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- チームB -->
        <div class="flex-1 flex flex-col min-w-0 h-full rounded-2xl overflow-hidden shadow-lg border border-gray-200 relative" style="background-color: var(--color-b);">
            <div class="team-header-box shrink-0">
                <div id="badge-b" class="absolute top-1 left-1/2 -translate-x-1/2 font-black px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs shadow-md hidden z-20 bg-red-600 border border-red-400 text-white animate-bounce">マッチP</div>
                <div class="w-10 h-10 flex items-center justify-center mr-2 shrink-0">
                    <img id="ui-logo-b" src="vb.png" onerror="this.src='https://placehold.co/100x100/ef4444/ffffff?text=B'" class="w-full h-full object-contain drop-shadow-md">
                </div>
                <div class="flex flex-col justify-center h-full min-w-0">
                    <div id="ui-name-b" class="text-base sm:text-lg font-black text-black whitespace-pre-wrap leading-tight text-left break-words truncate">チームB</div>
                </div>
            </div>

            <button id="score-btn-b" class="viewer-disable-click flex-1 w-full flex flex-col relative transition-all overflow-hidden min-h-0 cursor-pointer p-4 items-center justify-center" onclick="window.updateScore('B', 1)">
                <div id="serve-indicator-b" class="absolute top-3 left-3 flex items-center gap-1 px-3 py-1 bg-white text-black rounded-full font-black text-xs shadow-md z-20">
                    <i data-lucide="volleyball" class="w-3 h-3 fill-black"></i> サーブ
                </div>
                <div id="ui-score-b" class="score-digital text-white font-black w-full">0</div>
            </button>

            <div class="admin-only h-12 flex justify-end items-center px-3 bg-black/20 shrink-0 z-30">
                <button class="w-9 h-9 bg-white/30 hover:bg-white/40 rounded-full flex items-center justify-center text-black active:scale-90" onclick="window.updateScore('B', -1); event.stopPropagation();">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- ================= 3. モーダル・オーバーレイ ================= -->

    <!-- 試合開始 / 次のセット 待機 -->
    <div id="match-start-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[80] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4">
            <h2 id="start-overlay-title" class="text-2xl font-black text-gray-900">第 1 セット</h2>
            <p id="start-overlay-desc" class="text-sm text-gray-500 font-bold">準備ができたら開始ボタンを押してください</p>
            <button id="btn-start-set" onclick="window.startSetTimer()" class="admin-only w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black text-lg rounded-xl shadow-lg active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="play-circle" class="w-6 h-6"></i> 試合を開始する
            </button>
        </div>
    </div>

    <!-- セット終了 / 試合終了 -->
    <div id="next-set-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[90] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-yellow-100 flex items-center justify-center shadow-inner shrink-0">
                <i data-lucide="trophy" class="w-10 h-10 text-yellow-500"></i>
            </div>
            <h2 id="set-winner-text" class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">チームA がセット獲得！</h2>
            <div id="set-result-score" class="text-4xl font-black text-gray-800 my-2 font-mono tracking-widest shrink-0">25 - 23</div>
            
            <p id="viewer-wait-msg" class="text-sm text-gray-500 font-bold hidden">次のセットが始まるまでお待ちください</p>
            
            <button id="btn-next-set" onclick="window.nextSet()" class="admin-only w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black text-lg rounded-2xl shadow-lg active:scale-95 flex items-center justify-center gap-2 hidden">
                次のセットへ進む <i data-lucide="arrow-right" class="w-6 h-6"></i>
            </button>

            <div id="match-end-buttons" class="admin-only w-full flex flex-col gap-3 hidden">
                <button onclick="window.shareResultImage()" id="btn-save-img" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-2xl shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="image" class="w-5 h-5"></i> 試合結果を画像で保存・共有
                </button>
                <button onclick="window.openSettings()" class="w-full py-3 bg-blue-100 text-blue-800 font-bold text-sm rounded-2xl active:scale-95">続けて次の試合を設定・開始する</button>
                <button onclick="window.backToStartupMenu()" class="w-full py-3 bg-gray-200 text-gray-800 font-bold text-sm rounded-2xl active:scale-95">最初の画面(ホーム)に戻る</button>
            </div>
        </div>
    </div>

    <!-- 設定画面 (管理者用) -->
    <div id="settings-modal" class="fixed inset-0 bg-[#0b162c] z-[100] hidden flex-col max-h-screen">
        <div class="p-4 border-b border-[#1a2c4e] shrink-0 flex justify-between items-center bg-[#0b162c] z-10 shadow-md">
            <h2 class="text-xl font-black text-white flex items-center gap-2"><i data-lucide="settings" class="text-blue-400 w-6 h-6"></i> 試合設定</h2>
            <button onclick="window.backToStartupMenuFromSettings()" class="text-xs bg-gray-700 text-white px-3 py-2 rounded-lg font-bold active:scale-95"><i data-lucide="home" class="w-4 h-4 inline mr-1"></i>最初に戻る</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar pb-6 relative">
            <!-- 今日の試合一覧 -->
            <div class="p-3 bg-[#112240] border border-[#1a2c4e] rounded-2xl">
                <h3 class="text-gray-300 font-bold text-sm mb-2 flex items-center gap-1"><i data-lucide="list" class="w-4 h-4"></i> 今日の試合一覧</h3>
                <div id="settings-match-list" class="space-y-2"></div>
            </div>

            <!-- 設定フォーム -->
            <div class="p-4 bg-[#112240] border border-[#1a2c4e] rounded-2xl space-y-3">
                <div class="flex gap-3">
                    <div class="flex-1"><label class="block text-xs text-gray-400 font-bold mb-1">試合名 / 大会名</label><input type="text" id="input-match-name" class="w-full bg-[#060c18] border border-gray-700 rounded-lg px-3 py-2 text-white font-bold text-sm"></div>
                    <div class="flex-1"><label class="block text-xs text-gray-400 font-bold mb-1">開催場所</label><input type="text" id="input-location" class="w-full bg-[#060c18] border border-gray-700 rounded-lg px-3 py-2 text-white font-bold text-sm"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-4 bg-[#112240] border border-[#1a2c4e] rounded-2xl space-y-3">
                    <h3 class="text-gray-300 font-bold text-sm border-b border-gray-700 pb-1">左側 (Team A)</h3>
                    <button onclick="window.openRosterModal()" class="w-full py-3 bg-indigo-600 text-white font-black text-sm rounded-xl shadow active:scale-95 flex justify-center gap-1.5"><i data-lucide="users" class="w-4 h-4"></i> 選手登録・メンバー設定</button>
                    <div class="flex gap-2">
                        <div class="flex-1"><label class="block text-[10px] text-gray-400 font-bold mb-1">チーム名 (2行まで)</label><textarea id="input-name-a" rows="2" class="w-full bg-[#060c18] border border-gray-700 rounded-lg px-2 py-1.5 text-white font-bold text-sm resize-none"></textarea></div>
                        <div class="w-12 shrink-0 space-y-1">
                            <label class="block text-[9px] text-gray-400 font-bold mb-0.5 text-center">色</label>
                            <input type="color" id="input-color-a-val" class="w-full h-8 p-0 border-0 rounded cursor-pointer">
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-[#112240] border border-[#1a2c4e] rounded-2xl space-y-3">
                    <h3 class="text-gray-300 font-bold text-sm border-b border-gray-700 pb-1">右側 (Team B)</h3>
                    <div class="flex gap-2">
                        <div class="flex-1"><label class="block text-[10px] text-gray-400 font-bold mb-1">チーム名 (2行まで)</label><textarea id="input-name-b" rows="2" class="w-full bg-[#060c18] border border-gray-700 rounded-lg px-2 py-1.5 text-white font-bold text-sm resize-none"></textarea></div>
                        <div class="w-12 shrink-0 space-y-1">
                            <label class="block text-[9px] text-gray-400 font-bold mb-0.5 text-center">色</label>
                            <input type="color" id="input-color-b-val" class="w-full h-8 p-0 border-0 rounded cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="p-3 bg-[#112240] border border-[#1a2c4e] rounded-2xl">
                    <label class="block text-xs text-gray-400 font-bold mb-1">セット数</label>
                    <select id="input-format" class="w-full bg-[#060c18] border border-gray-700 rounded-lg px-2 py-2 text-white text-sm font-bold"><option value="3">3セット</option><option value="5">5セット</option></select>
                </div>
                <div class="p-3 bg-[#112240] border border-[#1a2c4e] rounded-2xl">
                    <label class="block text-xs text-gray-400 font-bold mb-1">基本点数</label>

    <!-- トースト通知 -->
    <div id="toast-msg" class="fixed top-12 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl z-[500] transform -translate-y-32 transition-transform duration-300 opacity-0 flex items-center gap-2 font-bold text-sm"></div>

    <!-- ================= 4. JavaScript ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'volleyball-fixed-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIzaSyBqhEJtfHxjFfLEMMRT9QIqT5e6eFr3_Q4", authDomain: "vb-scoreboard-fd516.firebaseapp.com", projectId: "vb-scoreboard-fd516" };
        
        let app, auth, db, docRef, currentUser;
        let state = createEmptyState();
        let globalMatches = [];
        let globalPlayers = [];
        let currentMatchUnsubscribe = null;
        const POSITIONS = { center: "センター", setter: "セッター", left: "レフト", backLeft: "Bレフト", right: "ライト", backRight: "Bライト" };

        function createEmptyState() {
            return {
                roomName: "", role: "admin", 
                teamA: { name: "渡慶次\nGOLDENS", score: 0, color: "#f5a623", setsWon: 0, logo: "" },
                teamB: { name: "チームB", score: 0, color: "#ef4444", setsWon: 0, logo: "" },
                currentSet: 1, serving: "A", matchStatus: "setting", matchDate: getJapaneseDate(),
                settings: { format: 3, targetPoints: 21, matchName: "練習試合", location: "体育館" },
                setScores: { 1: {A:0,B:0}, 2: {A:0,B:0}, 3: {A:0,B:0}, 4: {A:0,B:0}, 5: {A:0,B:0} },
                roster: { starters: {center:null, setter:null, left:null, backLeft:null, right:null, backRight:null}, bench: [] },
                updatedAt: Date.now(), hasResultImage: false
            };
        }

        function getJapaneseDate() {
            try { return new Intl.DateTimeFormat('ja-JP', { era: 'long', year: 'numeric', month: 'long', day: 'numeric', calendar: 'japanese' }).format(new Date()); } 
            catch(e) { const d = new Date(); return `令和${d.getFullYear() - 2018}年${d.getMonth()+1}月${d.getDate()}日`; }
        }

        window.showToast = (msg, type="info") => {
            const el = document.getElementById('toast-msg'); el.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="${type==='success'?'text-green-400':'text-red-400'} w-5 h-5"></i> ${msg}`;
            lucide.createIcons();
            el.classList.replace('-translate-y-32', 'translate-y-0'); el.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => { el.classList.replace('translate-y-0', '-translate-y-32'); el.classList.replace('opacity-100', 'opacity-0'); }, 3000);
        };

        async function initFirebase() {
            if(!app) { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }
            if(!currentUser) {
                try {
                    if (typeof __initial_auth_token !== 'undefined') await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                    currentUser = auth.currentUser;
                    
                    // Matches List Listener
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'matches'), (snap) => {
                        globalMatches = []; snap.forEach(doc => globalMatches.push({ id: doc.id, ...doc.data() }));
                        if(document.getElementById('settings-modal').classList.contains('flex')) window.renderSettingsMatchList();
                        if(document.getElementById('startup-match-list-container').classList.contains('flex')) window.renderViewerMatchList();
                        if(document.getElementById('startup-all-list-container').classList.contains('flex')) window.renderAllMatchList();
                    }, e => console.error(e));

                    // Players DB Listener
                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'rosters', 'teamA_db'), (snap) => {
                        if(snap.exists() && snap.data().players) globalPlayers = snap.data().players;
                        if(document.getElementById('players-db-modal').classList.contains('flex')) window.renderPlayersDBList();
                    });
                } catch(e) { console.error(e); window.showToast("ログインエラー", "error"); }
            }
        }

        document.addEventListener('DOMContentLoaded', () => { initFirebase(); lucide.createIcons(); });

        // --- Navigation ---
        window.startNewMatch = async () => {
            await initFirebase(); if(!currentUser) return;
            state = createEmptyState(); state.roomName = 'room_' + crypto.randomUUID().substring(0,8);
            fillSettingsForm();
            document.getElementById('btn-settings-update').classList.add('hidden'); document.getElementById('btn-settings-start').classList.remove('hidden');
            document.getElementById('startup-overlay').classList.replace('flex', 'hidden'); document.getElementById('settings-modal').classList.replace('hidden', 'flex');
            window.renderSettingsMatchList();
        };

        window.manageMatches = async () => {
            await initFirebase(); if(!currentUser) return;
            const today = globalMatches.filter(m => m.matchDate === getJapaneseDate()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
            if(today.length > 0) { state = { ...createEmptyState(), ...today[0] }; state.roomName = today[0].id; state.role = 'admin'; } 
            else { state = createEmptyState(); state.roomName = 'room_' + crypto.randomUUID().substring(0,8); }
            fillSettingsForm(); setupMatchListener();
            document.getElementById('btn-settings-start').classList.add('hidden'); document.getElementById('btn-settings-update').classList.remove('hidden');
            document.getElementById('startup-overlay').classList.replace('flex', 'hidden'); document.getElementById('settings-modal').classList.replace('hidden', 'flex');
            window.renderSettingsMatchList();
        };

        window.showViewerMatchList = async () => {
            await initFirebase(); document.getElementById('startup-menu').classList.add('hidden');
            document.getElementById('startup-match-list-container').classList.replace('hidden', 'flex'); window.renderViewerMatchList();
        };

        window.showAllMatchList = async () => {
            await initFirebase(); document.getElementById('startup-menu').classList.add('hidden');
            document.getElementById('startup-match-list-container').classList.replace('flex', 'hidden');
            document.getElementById('startup-all-list-container').classList.replace('hidden', 'flex'); window.renderAllMatchList();
        };

        window.backToStartupMenu = () => {
            document.getElementById('startup-match-list-container').classList.replace('flex', 'hidden'); document.getElementById('startup-menu').classList.remove('hidden');
            document.getElementById('startup-overlay').classList.replace('hidden', 'flex'); document.getElementById('next-set-overlay').classList.replace('flex', 'hidden');
        };
        window.backToStartupMenuFromAll = () => { document.getElementById('startup-all-list-container').classList.replace('flex', 'hidden'); document.getElementById('startup-menu').classList.remove('hidden'); };
        window.backToStartupMenuFromSettings = () => { document.getElementById('settings-modal').classList.replace('flex', 'hidden'); document.getElementById('startup-overlay').classList.replace('hidden', 'flex'); };
        window.backToViewerList = () => {
            if(currentMatchUnsubscribe) { currentMatchUnsubscribe(); currentMatchUnsubscribe = null; }
            state.role = 'viewer'; window.backToStartupMenu(); document.getElementById('startup-menu').classList.add('hidden');
            document.getElementById('startup-match-list-container').classList.replace('hidden', 'flex'); window.renderViewerMatchList();
        };

        // --- Core Match Logic ---
        function setupMatchListener() {
            if(currentMatchUnsubscribe) currentMatchUnsubscribe();
            if(!state.roomName) return;
            docRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', state.roomName);
            document.getElementById('connection-status').classList.replace('bg-red-500', 'bg-green-500'); document.getElementById('connection-status').classList.remove('animate-pulse');
            
            currentMatchUnsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data(); const myRole = state.role; const myRoom = state.roomName;
                    state = { ...createEmptyState(), ...data, role: myRole, roomName: myRoom };
                    renderUI(); handleOverlays();
                }
            });
        }

        async function saveToFirestore() {
            if (state.role !== 'admin' || !docRef || !currentUser) return;
            state.updatedAt = Date.now();
            try { await setDoc(docRef, state, { merge: true }); } catch(e) { window.showToast("保存エラー", "error"); console.error(e); }
        }

        window.updateScore = async (team, amount) => {
            if (state.matchStatus !== 'playing' || state.role !== 'admin') return;
            const t = team === 'A' ? state.teamA : state.teamB;
            if (t.score + amount < 0) return;
            if (state.setScores[state.currentSet] && state.setScores[state.currentSet].winner && amount > 0) return;

            t.score += amount; if (amount > 0) state.serving = team;
            state.setScores[state.currentSet][team] = t.score;

            const target = state.currentSet === state.settings.format ? 15 : state.settings.targetPoints;
            const scoreA = state.teamA.score; const scoreB = state.teamB.score;
            let setWinner = null;
            if (scoreA >= target && scoreA - scoreB >= 2) setWinner = 'A';
            else if (scoreB >= target && scoreB - scoreA >= 2) setWinner = 'B';
            
            state.setScores[state.currentSet].winner = setWinner;

            let winsA = 0, winsB = 0;
            for(let i=1; i<=state.settings.format; i++) { if(state.setScores[i].winner === 'A') winsA++; if(state.setScores[i].winner === 'B') winsB++; }
            state.teamA.setsWon = winsA; state.teamB.setsWon = winsB;

            if (setWinner) {
                const setsToWin = Math.ceil(state.settings.format / 2);
                if (winsA >= setsToWin || winsB >= setsToWin) { state.matchStatus = 'match_over'; generateAndSaveImage(); } 
                else { state.matchStatus = 'set_over'; }
            }
            renderUI(); handleOverlays(); await saveToFirestore();
        };

        window.nextSet = async () => {
            if(state.currentSet >= state.settings.format) return;
            state.currentSet++; state.teamA.score = 0; state.teamB.score = 0;
            state.serving = state.setScores[state.currentSet-1].winner === 'A' ? 'A' : 'B'; state.matchStatus = 'waiting';
            document.getElementById('next-set-overlay').classList.replace('flex', 'hidden');
            renderUI(); handleOverlays(); await saveToFirestore();
        };

        window.startSetTimer = async () => { state.matchStatus = 'playing'; document.getElementById('match-start-overlay').classList.replace('flex', 'hidden'); renderUI(); await saveToFirestore(); };

        // --- Settings & UI Updates ---
        function fillSettingsForm() {
            document.getElementById('input-match-name').value = state.settings.matchName; document.getElementById('input-location').value = state.settings.location;
            document.getElementById('input-name-a').value = state.teamA.name; document.getElementById('input-color-a-val').value = state.teamA.color;
            document.getElementById('input-name-b').value = state.teamB.name; document.getElementById('input-color-b-val').value = state.teamB.color;
            document.getElementById('input-format').value = state.settings.format; document.getElementById('input-target').value = state.settings.targetPoints;
        }

        window.saveSettingsAndStart = async () => {
            if(!confirm("新規試合を作成して開始しますか？")) return;
            applySettings(); state.roomName = 'room_' + crypto.randomUUID().substring(0,8);
            state.teamA.score = 0; state.teamB.score = 0; state.teamA.setsWon = 0; state.teamB.setsWon = 0; state.currentSet = 1; state.matchStatus = 'waiting';
            setupMatchListener(); document.getElementById('settings-modal').classList.replace('flex', 'hidden'); renderUI(); handleOverlays(); await saveToFirestore();
        };

        window.saveSettingsAndUpdate = async () => {
            applySettings(); if(state.matchStatus==='setting') state.matchStatus = 'waiting';
            document.getElementById('settings-modal').classList.replace('flex', 'hidden'); renderUI(); handleOverlays(); await saveToFirestore();
        };

        function applySettings() {
            state.settings.matchName = document.getElementById('input-match-name').value; state.settings.location = document.getElementById('input-location').value;
            state.teamA.name = document.getElementById('input-name-a').value; state.teamA.color = document.getElementById('input-color-a-val').value;
            state.teamB.name = document.getElementById('input-name-b').value; state.teamB.color = document.getElementById('input-color-b-val').value;
            state.settings.format = parseInt(document.getElementById('input-format').value); state.settings.targetPoints = parseInt(document.getElementById('input-target').value);
        }

        function renderUI() {
            if(state.role === 'viewer') {
                document.querySelectorAll('.viewer-disable-click').forEach(el => el.classList.add('pointer-events-none'));
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
                document.getElementById('btn-back-to-viewer-list').classList.remove('hidden'); document.getElementById('btn-back-to-viewer-list').classList.add('flex');
            } else {
                document.querySelectorAll('.viewer-disable-click').forEach(el => el.classList.remove('pointer-events-none'));
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                document.getElementById('btn-back-to-viewer-list').classList.add('hidden'); document.getElementById('btn-back-to-viewer-list').classList.remove('flex');
            }
            
            document.documentElement.style.setProperty('--color-a', state.teamA.color); document.documentElement.style.setProperty('--color-b', state.teamB.color);
            document.getElementById('ui-name-a').innerHTML = state.teamA.name.replace(/\n/g, '<br>'); document.getElementById('ui-name-b').innerHTML = state.teamB.name.replace(/\n/g, '<br>');
            document.getElementById('ui-score-a').textContent = state.teamA.score; document.getElementById('ui-score-b').textContent = state.teamB.score;
            document.getElementById('header-match-name').textContent = state.settings.matchName; document.getElementById('header-location').textContent = state.settings.location;
            document.getElementById('header-format').textContent = `${state.settings.format}S(${state.settings.targetPoints}pt)`; document.getElementById('ui-current-set').textContent = state.currentSet;
            
            const serveA = document.getElementById('serve-indicator-a'); const serveB = document.getElementById('serve-indicator-b');
            if(state.serving === 'A') { serveA.classList.remove('opacity-0'); serveB.classList.add('opacity-0'); } else { serveA.classList.add('opacity-0'); serveB.classList.remove('opacity-0'); }

            const target = state.currentSet === state.settings.format ? 15 : state.settings.targetPoints;
            const isDeuce = state.teamA.score >= target-1 && state.teamB.score >= target-1 && state.teamA.score === state.teamB.score;
            document.getElementById('ui-deuce-banner').style.display = isDeuce ? 'block' : 'none';

            const setsToWin = Math.ceil(state.settings.format / 2);
            const reqA = Math.max(target, state.teamB.score + 2); const reqB = Math.max(target, state.teamA.score + 2);
            const badgeA = document.getElementById('badge-a'); const badgeB = document.getElementById('badge-b');
            const scoreA = document.getElementById('ui-score-a'); const scoreB = document.getElementById('ui-score-b');
            
            badgeA.classList.add('hidden'); scoreA.classList.remove('score-pulse'); badgeB.classList.add('hidden'); scoreB.classList.remove('score-pulse');
            if(reqA - state.teamA.score === 1) { badgeA.classList.remove('hidden'); badgeA.textContent = state.teamA.setsWon === setsToWin-1 ? "マッチP" : "セットP"; if(badgeA.textContent==="マッチP") scoreA.classList.add('score-pulse'); }
            if(reqB - state.teamB.score === 1) { badgeB.classList.remove('hidden'); badgeB.textContent = state.teamB.setsWon === setsToWin-1 ? "マッチP" : "セットP"; if(badgeB.textContent==="マッチP") scoreB.classList.add('score-pulse'); }

            document.getElementById('table-th-a').textContent = state.teamA.name.replace(/\n/g, '').substring(0,3); document.getElementById('table-th-b').textContent = state.teamB.name.replace(/\n/g, '').substring(0,3);
            const tbody = document.getElementById('sets-tbody'); tbody.innerHTML = `<tr class="bg-gray-50 text-[10px] sm:text-xs font-black"><td>計</td><td class="text-gray-900">${state.teamA.setsWon}</td><td class="text-gray-900">${state.teamB.setsWon}</td></tr>`;
            for(let i=1; i<=state.settings.format; i++) {
                const s = state.setScores[i]; const isCur = i === state.currentSet;
                const vA = s.A>0 || isCur || s.winner ? s.A : '-'; const vB = s.B>0 || isCur || s.winner ? s.B : '-';
                let hA = `<span class="font-bold text-gray-500">${vA}</span>`; let hB = `<span class="font-bold text-gray-500">${vB}</span>`;
                if(isCur) { hA = `<span class="font-black text-gray-900 text-sm">${vA}</span>`; hB = `<span class="font-black text-gray-900 text-sm">${vB}</span>`; }
                if(s.winner==='A') hA = `<div class="text-[7px] text-red-600 leading-none">WIN</div><div class="text-red-600 font-black">${vA}</div>`;
                else if(s.winner==='B') hB = `<div class="text-[7px] text-red-600 leading-none">WIN</div><div class="text-red-600 font-black">${vB}</div>`;
                tbody.innerHTML += `<tr class="${isCur?'current-set-row':''} text-[10px] sm:text-xs text-gray-600 font-bold"><td>${i}S</td><td><div class="flex flex-col items-center justify-center">${hA}</div></td><td><div class="flex flex-col items-center justify-center">${hB}</div></td></tr>`;
            }
        }

        function handleOverlays() {
            const startOver = document.getElementById('match-start-overlay'); const nextOver = document.getElementById('next-set-overlay');
            startOver.classList.replace('flex', 'hidden'); nextOver.classList.replace('flex', 'hidden');
            if(state.matchStatus === 'waiting') {
                document.getElementById('start-overlay-title').textContent = `第 ${state.currentSet} セット`;
                if(state.role === 'viewer') { document.getElementById('start-overlay-desc').textContent = "管理者の開始をお待ちください"; document.getElementById('btn-start-set').classList.add('hidden'); }
                else { document.getElementById('start-overlay-desc').textContent = "準備ができたら開始を押してください"; document.getElementById('btn-start-set').classList.remove('hidden'); }
                startOver.classList.replace('hidden', 'flex');
            } else if(state.matchStatus === 'set_over' || state.matchStatus === 'match_over') {
                const winName = state.setScores[state.currentSet].winner === 'A' ? state.teamA.name.replace(/\n/g,' ') : state.teamB.name.replace(/\n/g,' ');
                const isOver = state.matchStatus === 'match_over';
                document.getElementById('set-winner-text').textContent = isOver ? `${winName} が勝利！` : `${winName} がセット獲得！`;
                document.getElementById('set-result-score').textContent = `${state.teamA.score} - ${state.teamB.score}`;
                
                if(state.role === 'viewer') {
                    document.getElementById('btn-next-set').classList.replace('flex', 'hidden'); document.getElementById('match-end-buttons').classList.replace('flex', 'hidden');
                    document.getElementById('viewer-wait-msg').classList.remove('hidden'); document.getElementById('viewer-wait-msg').textContent = isOver ? "試合終了。管理者が結果を保存中..." : "次のセットが始まるまでお待ちください";
                } else {
                    document.getElementById('viewer-wait-msg').classList.add('hidden');
                    if(isOver) { document.getElementById('btn-next-set').classList.replace('flex', 'hidden'); document.getElementById('match-end-buttons').classList.replace('hidden', 'flex'); }
                    else { document.getElementById('btn-next-set').classList.replace('hidden', 'flex'); document.getElementById('match-end-buttons').classList.replace('flex', 'hidden'); }
                }
                nextOver.classList.replace('hidden', 'flex');
            }
        }

        // --- Lists Rendering ---
        window.renderSettingsMatchList = () => {
            const list = document.getElementById('settings-match-list'); list.innerHTML = '';
            const today = globalMatches.filter(m => m.matchDate === getJapaneseDate()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
            if(today.length===0) { list.innerHTML='<div class="text-xs text-gray-500">試合はありません</div>'; return; }
            today.forEach(m => {
                const isCur = m.id === state.roomName;
                const status = m.matchStatus==='match_over' ? '<span class="text-[9px] bg-gray-600 px-1 rounded">終了</span>' : (m.matchStatus==='playing'||m.matchStatus==='set_over' ? '<span class="text-[9px] bg-red-600 text-white px-1 rounded">試合中</span>' : '<span class="text-[9px] bg-emerald-600 text-white px-1 rounded">準備中</span>');
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-2 rounded-lg cursor-pointer ${isCur?'bg-blue-900 border border-blue-500':'bg-gray-800 hover:bg-gray-700'} text-white`;
                div.innerHTML = `<div class="flex-1 min-w-0" onclick="window.selectMatchForEdit('${m.id}')"><div class="text-xs font-bold flex items-center gap-1">${status} <span class="truncate">${m.settings.matchName}</span></div><div class="text-[10px] text-gray-400">${m.teamA.name.replace(/\n/g,'')} vs ${m.teamB.name.replace(/\n/g,'')}</div></div>
                                 <button onclick="window.deleteMatch('${m.id}', event)" class="p-2 text-red-400 hover:text-red-300 active:scale-90"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                list.appendChild(div);
            });
            lucide.createIcons();
        };

        window.renderViewerMatchList = () => {
            const list = document.getElementById('match-list-body'); list.innerHTML = '';
            const today = globalMatches.filter(m => m.matchDate === getJapaneseDate()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
            if(today.length===0) { list.innerHTML='<div class="text-sm text-gray-500 py-6 text-center">公開されている今日の試合はありません</div>'; return; }
            today.forEach(m => {
                const isOver = m.matchStatus==='match_over';
                const status = isOver ? '<span class="bg-gray-200 text-gray-500 px-1.5 py-0.5 rounded text-[10px] font-bold">終了</span>' : '<span class="bg-red-100 text-red-600 px-1.5 py-0.5 rounded text-[10px] font-bold">進行中</span>';
                const div = document.createElement('div');
                div.className = `p-3 border rounded-xl bg-white shadow-sm mb-2 cursor-pointer active:scale-95 transition-transform ${isOver?'opacity-60':''}`;
                div.onclick = () => { if(isOver) window.showResultImage(m); else { state.roomName=m.id; state.role='viewer'; setupMatchListener(); document.getElementById('startup-overlay').classList.replace('flex', 'hidden'); } };
                div.innerHTML = `<div class="text-xs font-black mb-1 flex items-center gap-1">${status} ${m.settings.matchName}</div><div class="flex justify-between bg-gray-50 p-2 rounded items-center"><div class="text-xs font-black truncate flex-1 text-right pr-2">${m.teamA.name.replace(/\n/g,'')}</div><div class="text-sm font-black px-2">${m.teamA.setsWon} - ${m.teamB.setsWon}</div><div class="text-xs font-black truncate flex-1 text-left pl-2">${m.teamB.name.replace(/\n/g,'')}</div></div>`;
                list.appendChild(div);
            });
        };

        window.renderAllMatchList = () => {
            const list = document.getElementById('all-match-list-body'); list.innerHTML = '';
            const all = [...globalMatches].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
            if(all.length===0) { list.innerHTML='<div class="text-sm text-gray-500 py-6 text-center">試合データはありません</div>'; return; }
            
            const groups = {}; all.forEach(m => { const d = m.matchDate||'不明'; if(!groups[d]) groups[d]=[]; groups[d].push(m); });
            Object.keys(groups).sort((a,b)=>groups[b][0].updatedAt - groups[a][0].updatedAt).forEach(date => {
                list.innerHTML += `<h3 class="text-sm font-black text-gray-700 border-b pb-1 mb-2 mt-4">${date}</h3>`;
                groups[date].forEach(m => {
                    const isOver = m.matchStatus==='match_over';
                    const div = document.createElement('div');
                    div.className = "p-3 border rounded-xl bg-white shadow-sm mb-2 cursor-pointer active:scale-95";
                    div.onclick = () => { if(isOver) window.showResultImage(m); else { state.roomName=m.id; state.role='viewer'; setupMatchListener(); document.getElementById('startup-overlay').classList.replace('flex', 'hidden'); } };
                    div.innerHTML = `<div class="text-xs font-black mb-1">${m.settings.matchName}</div><div class="flex justify-between items-center"><div class="text-xs font-black flex-1 text-right pr-2">${m.teamA.name.replace(/\n/g,'')}</div><div class="text-sm font-black">${m.teamA.setsWon} - ${m.teamB.setsWon}</div><div class="text-xs font-black flex-1 text-left pl-2">${m.teamB.name.replace(/\n/g,'')}</div></div>`;
                    list.appendChild(div);
                });
            });
        };

        window.selectMatchForEdit = (id) => {
            const m = globalMatches.find(x => x.id === id); if(!m) return;
            state = { ...createEmptyState(), ...m }; state.roomName = id; state.role = 'admin';
            fillSettingsForm(); setupMatchListener(); window.renderSettingsMatchList(); window.showToast("設定を読み込みました", "success");
            document.getElementById('btn-settings-start').classList.add('hidden'); document.getElementById('btn-settings-update').classList.remove('hidden');
        };

        window.deleteMatch = async (id, event) => {
            event.stopPropagation(); if(!confirm("完全に削除しますか？(元に戻せません)")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', id));
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'match_images', id)).catch(()=>{});
                window.showToast("削除しました", "success");
                if(state.roomName === id) { state.roomName = ""; document.getElementById('input-match-name').value = "新規試合"; }
            } catch(e) { window.showToast("削除エラー", "error"); console.error(e); }
        };

        // --- Image Generation & Display ---
        async function generateAndSaveImage() {
            if(state.role !== 'admin' || !docRef) return;
            const canvas = await createResultCanvas(state);
            if(canvas) {
                try {
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'match_images', state.roomName), { resultImage: dataUrl });
                    await setDoc(docRef, { hasResultImage: true }, { merge: true });
                } catch(e) { console.error(e); }
            }
        }

        window.showResultImage = async (matchData) => {
            const container = document.getElementById('result-image-container'); container.innerHTML = '<i data-lucide="loader-2" class="w-8 h-8 animate-spin text-white"></i>'; lucide.createIcons();
            document.getElementById('result-image-modal').classList.replace('hidden', 'flex');
            
            let imageUrl = null;
            if(matchData.hasResultImage) {
                try {
                    const imgSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'match_images', matchData.id));
                    if(imgSnap.exists()) imageUrl = imgSnap.data().resultImage;
                } catch(e) {}
            }
            if(imageUrl) {
                container.innerHTML = `<img src="${imageUrl}" class="max-w-full rounded-xl shadow-2xl">`;
            } else {
                const canvas = await createResultCanvas(matchData);
                if(canvas) { canvas.className = "max-w-full rounded-xl shadow-2xl"; container.innerHTML = ''; container.appendChild(canvas); }
                else container.innerHTML = '<div class="text-red-500 bg-white p-4 font-bold rounded">画像生成失敗</div>';
            }
        };

        window.closeResultImageModal = () => document.getElementById('result-image-modal').classList.replace('flex', 'hidden');
        window.backToStartupFromImage = () => { window.closeResultImageModal(); window.backToStartupMenu(); };

        window.shareCurrentResultImage = () => {
            const container = document.getElementById('result-image-container');
            const img = container.querySelector('img'); const canvas = container.querySelector('canvas');
            const doShare = (blob) => {
                const file = new File([blob], `Result_${Date.now()}.jpg`, { type: 'image/jpeg' });
                if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:'試合結果'});
                else { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = file.name; a.click(); URL.revokeObjectURL(url); }
            };
            if(img) fetch(img.src).then(r=>r.blob()).then(doShare);
            else if(canvas) canvas.toBlob(doShare, 'image/jpeg');
        };

        window.shareResultImage = async () => {
            const btn = document.getElementById('btn-save-img'); btn.innerHTML = '処理中...';
            try {
                const imgSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'match_images', state.roomName));
                if(imgSnap.exists() && imgSnap.data().resultImage) {
                    fetch(imgSnap.data().resultImage).then(r=>r.blob()).then(blob => {
                        const file = new File([blob], 'Result.jpg', {type: 'image/jpeg'});
                        if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]});
                        else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
                    });
                }
            } catch(e) {}
            btn.innerHTML = '<i data-lucide="image" class="w-5 h-5 inline mr-1"></i> 画像保存・共有'; lucide.createIcons();
        };

        async function createResultCanvas(data) {
            const div = document.createElement('div');
            div.style.cssText = "position:fixed; top:-9999px; left:0; width:800px; background:#fff; color:#000; padding:40px; font-family:'Inter',sans-serif;";
            
            const setsToWin = Math.ceil(data.settings.format/2);
            const winner = data.teamA.setsWon >= setsToWin ? data.teamA.name.replace(/\n/g,' ') : data.teamB.name.replace(/\n/g,' ');
            
            let setsHtml = '';
            for(let i=1; i<=data.settings.format; i++) {
                const s = data.setScores[i];
                if(s && (s.A>0 || s.B>0 || s.winner)) {
                    setsHtml += `<tr>
                        <td style="border:1px solid #ccc; padding:10px; font-size:18px; font-weight:bold; text-align:center;">${i}</td>
                        <td style="border:1px solid #ccc; padding:10px; text-align:center;"><div style="font-size:32px; font-weight:900; color:${s.winner==='A'?'#ef4444':'#000'};">${s.A||0}</div></td>
                        <td style="border:1px solid #ccc; padding:10px; text-align:center;"><div style="font-size:32px; font-weight:900; color:${s.winner==='B'?'#ef4444':'#000'};">${s.B||0}</div></td>
                    </tr>`;
                }
            }

            let startersHtml = '';
            for(const [key, label] of Object.entries(POSITIONS)) {
                const s = data.roster?.starters?.[key];
                if(s) {
                    const p = globalPlayers.find(x=>x.id===s.id) || {name:''};
                    startersHtml += `<div style="display:flex; border-bottom:1px solid #eee; padding:8px 0;"><div style="width:120px; font-weight:bold; color:#666; font-size:16px;">${label}</div><div style="width:50px; font-weight:900; font-size:18px;">${s.number}</div><div style="flex:1; font-weight:900; font-size:18px;">${p.name}</div></div>`;
                }
            }
            
            let benchHtml = '';
            if(data.roster?.bench?.length > 0) {
                const names = data.roster.bench.map(b => {
                    const p = globalPlayers.find(x=>x.id===b.id) || {name:''};
                    return `<span style="display:inline-block; margin-right:15px; margin-bottom:5px;"><span style="color:#666; font-size:14px;">${b.number}</span> ${p.name}</span>`;
                }).join('');
                benchHtml = `<div style="margin-top:20px; padding-top:20px; border-top:2px dashed #ccc;"><h3 style="font-size:16px; font-weight:bold; color:#666; margin:0 0 10px 0;">控え選手</h3><div style="font-size:16px; font-weight:bold; display:flex; flex-wrap:wrap;">${names}</div></div>`;
            }

            div.innerHTML = `
                <div style="text-align:center; margin-bottom:30px;">
                    <h1 style="font-size:36px; font-weight:900; margin:0 0 10px 0;">${data.settings.matchName}</h1>
                    <div style="font-size:18px; color:#666; font-weight:bold;">${data.settings.location} | ${data.matchDate}</div>
                </div>
                <div style="background:#f3f4f6; padding:20px; border-radius:16px; text-align:center; margin-bottom:30px; display:flex; justify-content:center; align-items:center; gap:30px;">
                    <div style="font-size:24px; font-weight:900;">${winner} 勝利</div>
                    <div style="font-size:36px; font-weight:900; letter-spacing:4px;">${data.teamA.setsWon} - ${data.teamB.setsWon}</div>
                </div>
                <table style="width:100%; border-collapse:collapse; margin-bottom:40px; table-layout:fixed;">
                    <thead><tr>
                        <th style="border:1px solid #ccc; background:#f9fafb; padding:10px; width:15%;">セット</th>
                        <th style="border:1px solid #ccc; background:#f9fafb; padding:10px; width:42.5%; display:flex; justify-content:center; align-items:center; text-align:center;"><div style="font-size:24px; font-weight:900; line-height:1.2;">${data.teamA.name.replace(/\n/g,'<br>')}</div></th>
                        <th style="border:1px solid #ccc; background:#f9fafb; padding:10px; width:42.5%; display:flex; justify-content:center; align-items:center; text-align:center;"><div style="font-size:24px; font-weight:900; line-height:1.2;">${data.teamB.name.replace(/\n/g,'<br>')}</div></th>
                    </tr></thead>
                    <tbody>${setsHtml}</tbody>
                </table>
                <div>
                    <h2 style="font-size:22px; font-weight:900; margin:0 0 15px 0; border-bottom:3px solid #f5a623; padding-bottom:5px;">メンバーリスト (渡慶次)</h2>
                    ${startersHtml}
                    ${benchHtml}
                </div>
            `;
            document.body.appendChild(div);
            await new Promise(r=>setTimeout(r,100));
            const canvas = await html2canvas(div, {scale:2, backgroundColor:'#ffffff'});
            document.body.removeChild(div);
            return canvas;
        }

        // --- Players Roster Modals (Simplified) ---
        window.openRosterModal = () => { document.getElementById('settings-modal').classList.replace('flex','hidden'); document.getElementById('roster-modal').classList.replace('hidden','flex'); renderRosterLists(); };
        window.closeRosterModal = () => { document.getElementById('roster-modal').classList.replace('flex','hidden'); document.getElementById('settings-modal').classList.replace('hidden','flex'); saveToFirestore(); };
        
        function renderRosterLists() {
            const st = document.getElementById('roster-starters-list'); st.innerHTML = '';
            for(const [k, v] of Object.entries(POSITIONS)) {
                const s = state.roster.starters[k];
                if(s) { const p = globalPlayers.find(x=>x.id===s.id)||{name:''}; st.innerHTML += `<div class="flex justify-between items-center p-2 border rounded font-bold"><div class="w-16 text-xs text-gray-500">${v}</div><div class="flex-1 flex gap-2"><span class="w-6 h-6 bg-blue-100 text-blue-800 rounded text-center">${s.number}</span><span>${p.name}</span></div><button onclick="window.openPlayersDBModal('selectStarter','${k}')" class="px-3 py-1 bg-gray-200 text-xs rounded">変更</button></div>`; }
                else st.innerHTML += `<div class="flex justify-between items-center p-2 border rounded font-bold"><div class="w-16 text-xs text-gray-500">${v}</div><div class="flex-1 text-gray-400">未選択</div><button onclick="window.openPlayersDBModal('selectStarter','${k}')" class="px-3 py-1 bg-blue-600 text-white text-xs rounded">選択</button></div>`;
            }
            const bn = document.getElementById('roster-bench-list'); bn.innerHTML = '';
            state.roster.bench.forEach(b => { const p = globalPlayers.find(x=>x.id===b.id)||{name:''}; bn.innerHTML += `<div class="flex gap-2 p-2 border rounded font-bold bg-white"><span class="w-6 h-6 bg-gray-200 text-center rounded">${b.number}</span><span>${p.name}</span></div>`; });
        }

        let dbMode = 'manage', curPosKey = null;
        window.openPlayersDBModal = (mode, posKey=null) => {
            dbMode = mode; curPosKey = posKey;
            document.getElementById('roster-modal').classList.replace('flex','hidden'); document.getElementById('players-db-modal').classList.replace('hidden','flex');
            document.getElementById('db-modal-title').textContent = mode==='manage'?'選手管理':(mode==='selectStarter'?`${POSITIONS[curPosKey]}を選択`:'控え選択');
            document.getElementById('db-add-form').style.display = mode==='manage'?'flex':'none';
            document.getElementById('btn-db-select-bench').style.display = mode==='selectBench'?'block':'none';
            renderPlayersDBList();
        };
        window.closePlayersDBModal = () => { document.getElementById('players-db-modal').classList.replace('flex','hidden'); document.getElementById('roster-modal').classList.replace('hidden','flex'); renderRosterLists(); };

        window.addPlayerToDB = async () => {
            const g = document.getElementById('new-player-grade').value; const n = document.getElementById('new-player-name').value;
            if(!n) return; globalPlayers.push({id: crypto.randomUUID(), grade: g, name: n});
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rosters', 'teamA_db'), {players: globalPlayers}, {merge:true});
            document.getElementById('new-player-name').value = ''; renderPlayersDBList();
        };

        window.renderPlayersDBList = () => {
            const list = document.getElementById('db-list-container'); list.innerHTML = '';
            [...globalPlayers].sort((a,b)=>b.grade.localeCompare(a.grade)).forEach(p => {
                const isSt = Object.values(state.roster.starters).some(s=>s&&s.id===p.id);
                const d = document.createElement('div'); d.className = "flex justify-between items-center p-3 border rounded-xl bg-white shadow-sm font-bold mb-2";
                let action = '';
                if(dbMode==='manage') action = `<button onclick="window.delPlayer('${p.id}')" class="text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>`;
                else if(dbMode==='selectStarter') { if(isSt) action='<span class="text-xs text-gray-400">先発済</span>'; else action=`<button onclick="window.reqNum('${p.id}')" class="px-3 py-1 bg-blue-600 text-white rounded text-xs">選択</button>`; }
                else if(dbMode==='selectBench') { if(isSt) action='<span class="text-xs text-gray-400">先発済</span>'; else action=`<input type="checkbox" class="w-5 h-5 bench-cb" value="${p.id}" ${state.roster.bench.find(b=>b.id===p.id)?'checked':''}>`; }
                d.innerHTML = `<div class="flex items-center gap-3"><span class="text-gray-500 w-8">${p.grade}</span><span class="text-lg">${p.name}</span></div><div>${action}</div>`;
                list.appendChild(d);
            });
            lucide.createIcons();
        };

        window.delPlayer = async (id) => {
            if(!confirm("削除しますか？")) return;
            globalPlayers = globalPlayers.filter(p=>p.id!==id);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rosters', 'teamA_db'), {players: globalPlayers}, {merge:true}); renderPlayersDBList();
        };

        let tempPlayerId = null;
        window.reqNum = (id) => { tempPlayerId = id; document.getElementById('number-input-val').value=''; document.getElementById('number-input-name').textContent = globalPlayers.find(p=>p.id===id).name; document.getElementById('players-db-modal').classList.replace('flex','hidden'); document.getElementById('number-input-modal').classList.replace('hidden','flex'); setTimeout(()=>document.getElementById('number-input-val').focus(),100); };
        window.closeNumberInput = () => { document.getElementById('number-input-modal').classList.replace('flex','hidden'); document.getElementById('players-db-modal').classList.replace('hidden','flex'); };
        window.confirmNumberInput = () => {
            const v = document.getElementById('number-input-val').value; if(!v) return;
            state.roster.starters[curPosKey] = {id: tempPlayerId, number: v};
            document.getElementById('number-input-modal').classList.replace('flex','hidden'); window.closePlayersDBModal(); window.showToast("登録しました","success");
        };

        window.startSelectBench = () => { window.openPlayersDBModal('selectBench'); };
        window.confirmBenchSelection = () => {
            const cbs = document.querySelectorAll('.bench-cb:checked'); state.roster.bench = [];
            let needed = cbs.length; let done = 0;
            if(needed===0) { window.closePlayersDBModal(); return; }
            cbs.forEach(cb => {
                const num = prompt(`${globalPlayers.find(p=>p.id===cb.value).name} の背番号:`, "");
                state.roster.bench.push({id: cb.value, number: num||'0'}); done++;
                if(done===needed) { window.closePlayersDBModal(); window.showToast("登録しました","success"); }
            });
        };
    </script>
</body>
</html>
